(function(){

      if(label.includes('到手')&&y<0.55)badge='<span class="badge b-bad">预警</span>';
      else if(label==='商责无效订单'&&y>=2)badge='<span class="badge b-warn">关注</span>';
      else if((label==='实收'||label==='有效订单')&&chg<-0.3)badge='<span class="badge b-bad">预警</span>';
      else if((label==='实收'||label==='有效订单')&&chg<-0.15)badge='<span class="badge b-warn">关注</span>';
      h+=`<td>${fmt(y)}</td><td style="color:#8a8f99">${fmt(p)}</td><td class="${cls}">${txt}</td><td>${badge}</td>`;
    });
    h+='</tr>';
  });
  document.getElementById('coreTbl').innerHTML=h+'</tbody>';
})();

// 趋势图
(function(){
  const t=D['趋势'],W=1100,H=260,pad={l:56,r:56,t:16,b:28};
  const maxR=Math.max(...t.map(x=>x['美团收入']+x['淘闪收入']))*1.15;
  const maxO=Math.max(...t.map(x=>x['美团订单']+x['淘闪订单']))*1.15;
  const bw=(W-pad.l-pad.r)/t.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  for(let g=0;g<=4;g++){const y=pad.t+(H-pad.t-pad.b)*g/4;
    s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#eee"/>`+
       `<text x="${pad.l-6}" y="${y+4}" font-size="10" fill="#999" text-anchor="end">${fmt¥(maxR*(4-g)/4).replace('¥','')}</text>`+
       `<text x="${W-pad.r+6}" y="${y+4}" font-size="10" fill="#999">${Math.round(maxO*(4-g)/4)}</text>`;}
  t.forEach((d,i)=>{
    const x=pad.l+i*bw, mh=d['美团收入']/maxR*(H-pad.t-pad.b), th=d['淘闪收入']/maxR*(H-pad.t-pad.b);
    const yb=H-pad.b;
    s+=`<rect x="${x+1}" y="${yb-mh-th}" width="${bw-2}" height="${th}" fill="#82a7e8"><title>${d.date} 淘闪${fmt¥(d['淘闪收入'])}</title></rect>`;
    s+=`<rect x="${x+1}" y="${yb-mh}" width="${bw-2}" height="${mh}" fill="#2f6fde"><title>${d.date} 美团${fmt¥(d['美团收入'])}</title></rect>`;
    if(i%5===0||i===t.length-1)s+=`<text x="${x+bw/2}" y="${H-8}" font-size="10" fill="#999" text-anchor="middle">${d.date}</text>`;
  });
  let pts=t.map((d,i)=>`${pad.l+i*bw+bw/2},${H-pad.b-(d['美团订单']+d['淘闪订单'])/maxO*(H-pad.t-pad.b)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="#e6a23c" stroke-width="2"/>`;
  s+=`<text x="${pad.l}" y="12" font-size="11" fill="#2f6fde">■ 美团+淘闪实收</text><text x="${pad.l+130}" y="12" font-size="11" fill="#e6a23c">— 有效订单（右轴）</text></svg>`;
  document.getElementById('trend').innerHTML=s;
})();

// 排行
(function(){
  const top=[...D['门店']].sort((a,b)=>b['收入']-a['收入']).slice(0,10);
  const low=D['门店'].filter(s=>s['订单']>0).sort((a,b)=>a['到手率']-b['到手率']).slice(0,10);
  document.getElementById('rankTop').innerHTML=top.map((s,i)=>`<li><span><span class="n">${i+1}</span>${s['店']}</span><b>${fmt¥(s['收入'])}</b></li>`).join('');
  document.getElementById('rankLow').innerHTML=low.map((s,i)=>`<li><span><span class="n">${i+1}</span>${s['店']}</span><b class="${s['到手率']<0.55?'up':''}">${fmtP(s['到手率'])}</b></li>`).join('');
})();

// 逐店明细
(function(){
  const tbody=document.querySelector('#storeTbl tbody');
  const cities=[...new Set(D['门店'].map(s=>s['城市']))].sort();
  document.getElementById('cityFilter').innerHTML='<option value="">全部城市</option>'+cities.map(c=>`<option>${c}</option>`).join('');
  let sortK='收入',asc=false;
  function badge(s){
    if(!s['预警'].length)return '<span class="badge b-ok">正常</span>';
    const w=s['预警'];
    if(w.includes('到手率低')||w.includes('收入大跌'))return `<span class="badge b-bad">${w.join('·')}</span>`;
    if(w.includes('昨日零单'))return `<span class="badge b-gray">${w.join('·')}</span>`;
    return `<span class="badge b-warn">${w.join('·')}</span>`;
  }
  function render(){
    const cf=document.getElementById('cityFilter').value, wf=document.getElementById('warnFilter').value,
          q=document.getElementById('nameSearch').value.trim();
    let rows=D['门店'].filter(s=>(!cf||s['城市']===cf)&&(!wf||(wf==='warn'?s['预警'].length:!s['预警'].length))&&(!q||s['店'].includes(q)));
    rows.sort((a,b)=>asc?(a[sortK]>b[sortK]?1:-1):(a[sortK]<b[sortK]?1:-1));
    tbody.innerHTML=rows.map(s=>{
      const plat=[s['美团有']?'美团':'',s['淘闪有']?'淘闪':''].filter(Boolean).join('+');
      const [cls,txt]=wowTxt(s['环比']);
      return `<tr><td>${s['店']}</td><td>${s['城市']}</td><td>${fmt¥(s['收入'])}</td><td>${s['订单']}</td>`+
        `<td class="${s['到手率']<0.55&&s['订单']>0?'up':''}">${s['订单']>0?fmtP(s['到手率']):'—'}</td>`+
        `<td class="${cls}">${txt}</td><td>${s['商责']||''}</td><td style="color:#8a8f99">${plat}</td><td>${badge(s)}</td></tr>`;
    }).join('');
  }
  document.querySelectorAll('#storeTbl th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(sortK===k)asc=!asc; else{sortK=k;asc=false;} render();
  });
  ['cityFilter','warnFilter'].forEach(id=>document.getElementById(id).onchange=render);
  document.getElementById('nameSearch').oninput=render;
  render();
})();
