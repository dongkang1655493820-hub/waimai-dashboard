function shortName(s){ return s.replace("同庆楼",""); }
function pct(x, d){ return (x*100).toFixed(d===undefined?2:d)+"%"; }

function applyFilter(){
  var owner = document.getElementById("ownerFilter").value;
  var f = function(r){ return !owner || r.负责人 === owner; };

  // KPI
  var stores = DATA.stores.filter(f);
  var income = stores.reduce(function(a,s){return a+s.收入;},0);
  var orders = stores.reduce(function(a,s){return a+s.订单;},0);
  var rs0 = DATA.reviews.filter(f);
  var bad0 = rs0.reduce(function(a,r){return a+r.差评数;},0);
  var kpis = [
    ["昨日实收（三平台）","¥"+Math.round(income).toLocaleString()],
    ["昨日有效订单",orders.toLocaleString()],
    ["近30天差评率",(function(){
      var ratio = rs0.reduce(function(a,r){return a+r.评价数;},0) / DATA.reviews.reduce(function(a,r){return a+r.评价数;},0);
      var totalOrders = Math.round(DATA.reviewMeta.有效订单总数 * ratio);
      return totalOrders ? pct(bad0/totalOrders) : "-";
    })()],
    ["商品质量分（近7日）",(function(){
      var q = DATA.quality.filter(f);
      return q.length ? (q.reduce(function(a,r){return a+r.商品质量分;},0)/q.length).toFixed(2) : "-";
    })()],
    ["食品安全负反馈率（近7日）",(function(){
      var q = DATA.foodsafe.filter(f);
      return q.length ? (q.reduce(function(a,r){return a+r.食品安全负反馈率;},0)/q.length).toFixed(1)+"%" : "-";
    })()]
  ];
  document.getElementById("kpis").innerHTML = kpis.map(function(k){
    return '<div class="kpi"><div class="label">'+k[0]+'</div><div class="val">'+k[1]+'</div></div>';
  }).join("");

  // 评价表（全部，按差评率降序）
  var rs = rs0.sort(function(a,b){return a.差评率-b.差评率;});
  document.getElementById("reviewTable").innerHTML = rs.map(function(r){
    var cls = r.差评率 >= 0.01 ? "bad" : "";
    return "<tr><td>"+shortName(r.店)+"</td><td>"+r.负责人+"</td><td>"+r.评价数+"</td><td class='"+cls+"'>"+pct(r.差评率)+"</td><td>"+Math.round(r.回复率*100)+"%</td></tr>";
  }).join("");
  document.getElementById("reviewSummary").textContent = "共"+rs.length+"家 ｜ 差评 "+bad0;
  document.getElementById("reviewMeta").textContent = "口径："+DATA.reviewMeta.口径;

  // 质量分表（全部，按分数升序）
  var qs = DATA.quality.filter(f).sort(function(a,b){return b.商品质量分-a.商品质量分;});
  document.getElementById("qualityTable").innerHTML = qs.map(function(r){
    var cls = r.商品质量分 < 4.3 ? "bad" : "";
    return "<tr><td>"+shortName(r.店)+"</td><td>"+r.负责人+"</td><td class='"+cls+"'>"+r.商品质量分.toFixed(2)+"</td></tr>";
  }).join("");
  document.getElementById("qualitySummary").textContent = qs.length+"家店均值 "+(qs.reduce(function(a,r){return a+r.商品质量分;},0)/qs.length).toFixed(2);

  // 食安表（全部，按负反馈率降序）
  var fs = DATA.foodsafe.filter(f).sort(function(a,b){return a.食品安全负反馈率-b.食品安全负反馈率;});
  document.getElementById("foodTable").innerHTML = fs.map(function(r){
    var cls = r.食品安全负反馈率 > 15 ? "bad" : "";
    return "<tr><td>"+shortName(r.店)+"</td><td>"+r.负责人+"</td><td class='"+cls+"'>"+r.食品安全负反馈率.toFixed(1)+"%</td></tr>";
  }).join("");
  document.getElementById("foodSummary").textContent = fs.length+"家店均值 "+(fs.reduce(function(a,r){return a+r.食品安全负反馈率;},0)/fs.length).toFixed(1)+"%";

  // 门店排行（全部，按实收降序）
  var ss = stores.sort(function(a,b){return b.收入-a.收入;});
  document.getElementById("storeTable").innerHTML = ss.map(function(s){
    return "<tr><td>"+shortName(s.店)+"</td><td>"+s.负责人+"</td><td>¥"+Math.round(s.收入).toLocaleString()+"</td><td>"+s.订单+"</td><td>"+(s.到手率*100).toFixed(1)+"%</td></tr>";
  }).join("");
}
