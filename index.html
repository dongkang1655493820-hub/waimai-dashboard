<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同庆楼外卖经营看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#1f2329;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;flex-wrap:wrap;gap:8px}
header h1{font-size:20px}
header .sub{color:#646a73;font-size:12px}
.card{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;color:#646a73;font-weight:normal}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi .label{font-size:12px;color:#646a73;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700}
.kpi .wow{font-size:12px;margin-top:4px}
.up{color:#cf1322}.down{color:#389e0d}.flat{color:#646a73}
.good{color:#389e0d}.bad{color:#cf1322}
.bar{height:8px;background:#f0f0f0;border-radius:4px;min-width:90px}
.fill{height:100%;background:#2f7cf6;border-radius:4px}
.focus{line-height:1.9;font-size:13.5px}
.focus li{margin-bottom:6px;list-style:none;padding-left:4px}
.focus li::before{content:"▸ ";color:#e6a23c;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#fafafa;font-weight:600;color:#434343;position:sticky;top:0}
tbody tr:hover{background:#f7f9fc}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.b-ok{background:#e7f7ee;color:#15803d}
.b-warn{background:#fef3e2;color:#b45309}
.b-bad{background:#fdecec;color:#b91c1c}
.b-info{background:#eef2ff;color:#3730a3}
.b-gray{background:#f1f2f4;color:#646a73}
.rank{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.rank{grid-template-columns:1fr}}
.rank ol{list-style:none}
.rank li{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #f5f5f5;font-size:13px}
.rank .n{color:#8a8f99;width:22px}
.toolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
.scrollx{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>同庆楼外卖经营看板</h1>
<div class="sub">数据日期 2026-10-08 ｜ 美团61家 · 淘闪61家 ｜ 生成时间 2026-10-09</div>
</header>
<div class="card"><h2>⭐ 评价分析 <span class="tag">近30天 · 美团+淘闪</span></h2>
<p>评价总数 6803 ｜ 差评 841 ｜ 差评率 12.4%</p>
<p>口径：美团差评=包装评分≤3；淘闪差评=总体评分≤3</p>
</div>
<div class="card"><h2>📊 看板已更新</h2><p>完整版请查看线上地址（部署中）</p></div>
</div>
</body>
</html>
