  document.getElementById("qualitySummary").textContent = "共"+qs.length+"家 ｜ 均值 "+(qs.reduce(function(a,r){return a+r.商品质量分;},0)/qs.length).toFixed(2);
  var c2 = initChart("chartQuality");
  var qLow = qs.slice().sort(function(a,b){return a.商品质量分-b.商品质量分;}).slice(0,10);
  c2.setOption({
    title:{text:"质量分最低的10家门店",left:"center",textStyle:{fontSize:13}},
    tooltip:{trigger:"axis"},
    xAxis:{type:"value",min:3.8,max:5},
    yAxis:{type:"category",data:qLow.map(function(r){return shortName(r.店);}).reverse(),axisLabel:{fontSize:11}},
    series:[{type:"bar",data:qLow.map(function(r){return r.商品质量分;}).reverse(),
      itemStyle:{color:function(p){return p.value<4.3?"#e53e3e":p.value<4.5?"#ed8936":"#38a169";}},
      label:{show:true,position:"right",fontSize:10}}],
    grid:{left:110,right:50,top:40,bottom:30}
  });
  document.getElementById("qualityTable").innerHTML = qs.map(function(r){
    var badge = r.商品质量分<4.3?'<span class="badge badge-danger">待改进</span>':r.商品质量分<4.5?'<span class="badge badge-warn">一般</span>':'<span class="badge badge-ok">优秀</span>';
    return "<tr><td>"+shortName(r.店)+"</td><td>"+r.负责人+"</td><td><b>"+r.商品质量分.toFixed(2)+"</b></td><td>"+badge+"</td></tr>";
  }).join("");

  /* ===== 食安负反馈率 ===== */
  var fs = DATA.foodsafe.filter(f).slice().sort(function(a,b){return a.食品安全负反馈率-b.食品安全负反馈率;});
  document.getElementById("foodSummary").textContent = "共"+fs.length+"家 ｜ 均值 "+(fs.reduce(function(a,r){return a+r.食品安全负反馈率;},0)/fs.length).toFixed(1)+"%";
  var c3 = initChart("chartFood");
  var fHigh = fs.slice().sort(function(a,b){return b.食品安全负反馈率-a.食品安全负反馈率;}).slice(0,10);
  c3.setOption({
    title:{text:"负反馈率最高的10家门店",left:"center",textStyle:{fontSize:13}},
    tooltip:{trigger:"axis",formatter:function(p){return p[0].name+"<br/>负反馈率: "+p[0].value+"%";}},
    xAxis:{type:"value",axisLabel:{formatter:"{value}%"}},
    yAxis:{type:"category",data:fHigh.map(function(r){return shortName(r.店);}).reverse(),axisLabel:{fontSize:11}},
    series:[{type:"bar",data:fHigh.map(function(r){return +r.食品安全负反馈率.toFixed(1);}).reverse(),
      itemStyle:{color:function(p){return p.value>15?"#e53e3e":p.value>10?"#ed8936":"#38a169";}},
      label:{show:true,position:"right",formatter:"{c}%",fontSize:10}}],
    grid:{left:110,right:50,top:40,bottom:30}
  });
  document.getElementById("foodTable").innerHTML = fs.map(function(r){
    var badge = r.食品安全负反馈率>15?'<span class="badge badge-danger">高</span>':r.食品安全负反馈率>10?'<span class="badge badge-warn">中</span>':'<span class="badge badge-ok">低</span>';
    return "<tr><td>"+shortName(r.店)+"</td><td>"+r.负责人+"</td><td><b>"+r.食品安全负反馈率.toFixed(1)+"%</b></td><td>"+badge+"</td></tr>";
  }).join("");

  /* ===== 门店排行 ===== */
  var ss = stores.slice().sort(function(a,b){return b.收入-a.收入;});
  var c4 = initChart("chartStore");
  var top15 = ss.slice(0,15);
  c4.setOption({
    title:{text:"昨日实收 Top15",left:"center",textStyle:{fontSize:13}},
    tooltip:{trigger:"axis",formatter:function(p){return p[0].name+"<br/>实收: ¥"+Number(p[0].value).toLocaleString();}},
    xAxis:{type:"value",axisLabel:{formatter:function(v){return "¥"+(v/1000)+"k";}}},
    yAxis:{type:"category",data:top15.map(function(s){return shortName(s.店);}).reverse(),axisLabel:{fontSize:11}},
    series:[{type:"bar",data:top15.map(function(s){return Math.round(s.收入);}).reverse(),
      itemStyle:{color:{type:"linear",x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:"#63b3ed"},{offset:1,color:"#2b6cb0"}]}},
      label:{show:true,position:"right",formatter:function(p){return "¥"+Number(p.value).toLocaleString();},fontSize:10}}],
    grid:{left:110,right:90,top:40,bottom:30}
  });
  document.getElementById("storeTable").innerHTML = ss.map(function(s,i){
    var medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
    return "<tr><td>"+medal+"</td><td>"+shortName(s.店)+"</td><td>"+s.负责人+"</td><td><b>¥"+Math.round(s.收入).toLocaleString()+"</b></td><td>"+s.订单+"</td><td>"+(s.到手率*100).toFixed(1)+"%</td></tr>";
  }).join("");
}

window.addEventListener("resize", function(){
  for(var k in charts){ charts[k].resize(); }
});

applyFilter();
</script>
